<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.2.1/css/bootstrap.min.css"
        type="text/css" />
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/font-awesome/4.7.0/css/font-awesome.min.css"
        type="text/css" />
    <link rel="stylesheet" href="assets/css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/hover.css/2.3.1/css/hover-min.css"
        integrity="sha512-csw0Ma4oXCAgd/d4nTcpoEoz4nYvvnk21a8VA2h2dzhPAvjbUIK6V3si7/g/HehwdunqqW18RwCJKpD7rL67Xg=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <title>Aaron Storey Cv Page</title>
</head>
<!-- Google tag (gtag.js) -->


<body>
    <header>
        <div id="nav-bar">
        </div>
    </header>
    <section>
        <div class="container bg-color-personal-info text-center">
            <div class="row">
                <div class="col-12">
                    <h3 class="section-heading uppercase">
                        CV's
                    </h3>
                </div>
            </div>
            <div id="carouselExample" class="carousel slide">
                <div class="carousel-inner">
                    <div class="carousel-item active">
                        <div class="col-12 m-2">
                            <h4>Programming CV</h4>
                            <embed src="assets\cv\programming-cv.pdf" type="application/pdf" width="60%"
                                height="400px" />
                        </div>
                    </div>
                    <div class="carousel-item">
                        <div class="col-12 m-2">
                            <h4>Full CV</h4>
                            <embed src="assets\cv\CV-2026.pdf" type="application/pdf" width="60%" height="400px" />
                        </div>
                    </div>
                    <div class="carousel-item">
                        <div class="col-12 m-2">
                            <h4>Ecommerce CV</h4>
                            <embed src="assets\cv\e-commerce-product-manger-cv.pdf" type="application/pdf" width="60%"
                                height="400px" />
                        </div>
                    </div>
                </div>
                <button class="carousel-control-prev" type="button" data-bs-target="#carouselExample"
                    data-bs-slide="prev">
                    <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                    <span class="visually-hidden">Previous</span>
                </button>
                <button class="carousel-control-next" type="button" data-bs-target="#carouselExample"
                    data-bs-slide="next">
                    <span class="carousel-control-next-icon" aria-hidden="true"></span>
                    <span class="visually-hidden">Next</span>
                </button>
            </div>
        </div>
    </section>
    <section id="footer">

    </section>
</body>
<script src="assets/js/nav-bar.js"></script>
<script src="assets/js/google-analytics.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>

</html>
